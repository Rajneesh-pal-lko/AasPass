<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AasPass Admin — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111b21;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: #202c33;
      border-radius: 12px;
      padding: 48px 40px;
      width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      color: #00a884;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo p {
      color: #8696a0;
      font-size: 13px;
      margin-top: 4px;
    }
    label {
      display: block;
      color: #8696a0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #2a3942;
      border: 1px solid #3b4a54;
      border-radius: 8px;
      color: #e9edef;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #00a884;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #00a884;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #02b89a; }
    .error {
      margin-top: 14px;
      padding: 10px 14px;
      background: #3b2a2a;
      border: 1px solid #7b3333;
      border-radius: 8px;
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>✈️ AasPass</h1>
      <p>Admin Dashboard</p>
    </div>
    <form method="POST" action="/admin/login">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter admin password" autofocus required>
      <button type="submit">Sign In</button>
      <div id="err" class="error" style="display:none">Incorrect password. Try again.</div>
    </form>
  </div>
  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
